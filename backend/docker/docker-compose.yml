services:
  postgres:
    image: postgres:17
    container_name: nexo-finance-postgres
    environment:
      POSTGRES_DB: nexo_finance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexo_finance"]
      interval: 10s
      timeout: 5s
      retries: 5