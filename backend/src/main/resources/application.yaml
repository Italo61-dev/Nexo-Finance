server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: backend

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

  data:
    web:
      pageable:
        default-page-size: 10
        max-page-size: 100
      page-serialization-mode: via-dto

security:
  jwt:
    expiration-seconds: 86400
    issuer: nexo-finance
  oauth2:
    google:
      client-id: ${GOOGLE_CLIENT_ID:740644395958-ku4hnjhirpdagoua1c3gagm071g3cieh.apps.googleusercontent.com}
