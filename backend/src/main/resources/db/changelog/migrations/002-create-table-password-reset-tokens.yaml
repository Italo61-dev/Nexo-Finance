databaseChangeLog:
  - changeSet:
      id: 002-create-table-password-reset-tokens
      author: italo
      changes:
        - createTable:
            tableName: PASSWORD_RESET_TOKENS
            columns:
              - column:
                  name: ID
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: TOKEN
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: USER_ID
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: FK_PASSWORD_RESET_USER
                    references: USERS(ID)
              - column:
                  name: EXPIRY_DATE
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: USED
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: CREATED_AT
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - createIndex:
            indexName: IDX_PASSWORD_RESET_TOKEN
            tableName: PASSWORD_RESET_TOKENS
            columns:
              - column:
                  name: TOKEN
