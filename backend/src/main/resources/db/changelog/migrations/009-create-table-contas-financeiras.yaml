databaseChangeLog:
  - changeSet:
      id: 009-create-table-contas-financeiras
      author: italo
      changes:
        - createTable:
            tableName: CONTAS_FINANCEIRAS
            columns:
              - column:
                  name: ID
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: USUARIO_ID
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: FK_CONTA_FINANCEIRA_USUARIO
                    references: USERS(ID)
                    deleteCascade: true
              - column:
                  name: NOME
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: INSTITUICAO
                  type: VARCHAR(100)
              - column:
                  name: TIPO_CONTA
                  type: VARCHAR(30)
                  constraints:
                    nullable: false
              - column:
                  name: ATIVO
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: CREATED_AT
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: UPDATED_AT
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - sql:
            sql: >
              ALTER TABLE CONTAS_FINANCEIRAS
                ADD CONSTRAINT CK_CONTA_TIPO CHECK (TIPO_CONTA IN ('CONTA_CORRENTE', 'POUPANCA', 'CARTAO_CREDITO', 'CARTEIRA', 'INVESTIMENTO', 'OUTROS')),
                ADD CONSTRAINT CK_CONTA_NOME CHECK (LENGTH(TRIM(NOME)) > 0);
              CREATE UNIQUE INDEX UK_CONTA_USUARIO_NOME
                ON CONTAS_FINANCEIRAS (USUARIO_ID, LOWER(NOME));
