databaseChangeLog:
  - changeSet:
      id: 008-create-table-subcategorias
      author: italo
      changes:
        - createTable:
            tableName: SUBCATEGORIAS
            remarks: "Subcategorias vinculadas a uma categoria principal para detalhamento refinado das movimentações financeiras (ex: Categoria Alimentação -> Subcategorias Restaurante, Mercado)."
            columns:
              - column:
                  name: ID
                  type: BIGSERIAL
                  remarks: "Identificador único da subcategoria (chave primária incremental)."
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: CATEGORIA_ID
                  type: BIGINT
                  remarks: "Identificador da categoria principal à qual esta subcategoria pertence."
                  constraints:
                    nullable: false
                    foreignKeyName: FK_SUBCATEGORIA_CATEGORIA
                    references: CATEGORIAS(ID)
              - column:
                  name: NOME
                  type: VARCHAR(100)
                  remarks: "Nome da subcategoria (ex: Supermercado, Combustível, Farmácia). Único dentro da categoria."
                  constraints:
                    nullable: false
              - column:
                  name: ATIVO
                  type: BOOLEAN
                  defaultValueBoolean: true
                  remarks: "Indicador lógico de ativação da subcategoria (soft delete). True para ativa, false para inativa."
                  constraints:
                    nullable: false
              - column:
                  name: CREATED_AT
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  remarks: "Data e hora de criação do registro no sistema."
                  constraints:
                    nullable: false
              - column:
                  name: UPDATED_AT
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  remarks: "Data e hora da última atualização do registro no sistema."
                  constraints:
                    nullable: false
        - sql:
            sql: >
              ALTER TABLE SUBCATEGORIAS
                ADD CONSTRAINT CK_SUBCATEGORIA_NOME CHECK (LENGTH(TRIM(NOME)) > 0);
              CREATE UNIQUE INDEX UK_SUBCATEGORIA_CATEGORIA_NOME
                ON SUBCATEGORIAS (CATEGORIA_ID, LOWER(NOME));
