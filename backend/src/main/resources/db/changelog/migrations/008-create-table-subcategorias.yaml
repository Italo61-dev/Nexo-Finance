databaseChangeLog:
  - changeSet:
      id: 008-create-table-subcategorias
      author: italo
      changes:
        - createTable:
            tableName: SUBCATEGORIAS
            columns:
              - column:
                  name: ID
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: CATEGORIA_ID
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: FK_SUBCATEGORIA_CATEGORIA
                    references: CATEGORIAS(ID)
              - column:
                  name: NOME
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: ATIVO
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: CREATED_AT
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: UPDATED_AT
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - sql:
            sql: >
              ALTER TABLE SUBCATEGORIAS
                ADD CONSTRAINT CK_SUBCATEGORIA_NOME CHECK (LENGTH(TRIM(NOME)) > 0);
              CREATE UNIQUE INDEX UK_SUBCATEGORIA_CATEGORIA_NOME
                ON SUBCATEGORIAS (CATEGORIA_ID, LOWER(NOME));
