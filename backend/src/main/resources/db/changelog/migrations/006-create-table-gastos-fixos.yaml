databaseChangeLog:
  - changeSet:
      id: 006-create-table-gastos-fixos
      author: italo
      changes:
        - createTable:
            tableName: GASTOS_FIXOS
            columns:
              - column:
                  name: ID
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: USUARIO_ID
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: FK_GASTO_FIXO_USUARIO
                    references: USERS(ID)
                    deleteCascade: true
              - column:
                  name: DESCRICAO
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: VALOR
                  type: NUMERIC(15,2)
                  constraints:
                    nullable: false
              - column:
                  name: ATIVO
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: CREATED_AT
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: UPDATED_AT
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - sql:
            sql: >
              ALTER TABLE GASTOS_FIXOS
                ADD CONSTRAINT CK_GASTO_FIXO_VALOR CHECK (VALOR > 0),
                ADD CONSTRAINT CK_GASTO_FIXO_DESCRICAO CHECK (LENGTH(TRIM(DESCRICAO)) > 0);
        - createIndex:
            indexName: IDX_GASTOS_FIXOS_USUARIO
            tableName: GASTOS_FIXOS
            columns:
              - column:
                  name: USUARIO_ID
