databaseChangeLog:
  - changeSet:
      id: 006-create-table-gastos-fixos
      author: italo
      changes:
        - createTable:
            tableName: GASTOS_FIXOS
            remarks: "Gastos fixos recorrentes do usuário (como aluguel, condomínio, internet, mensalidades), utilizados para planejamento e cálculo de capacidade financeira."
            columns:
              - column:
                  name: ID
                  type: BIGSERIAL
                  remarks: "Identificador único do gasto fixo (chave primária incremental)."
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: USUARIO_ID
                  type: BIGINT
                  remarks: "Identificador do usuário proprietário deste gasto fixo."
                  constraints:
                    nullable: false
                    foreignKeyName: FK_GASTO_FIXO_USUARIO
                    references: USERS(ID)
                    deleteCascade: true
              - column:
                  name: DESCRICAO
                  type: VARCHAR(150)
                  remarks: "Descrição ou nome do gasto fixo recorrente (ex: Aluguel, Internet, Academia)."
                  constraints:
                    nullable: false
              - column:
                  name: VALOR
                  type: NUMERIC(15,2)
                  remarks: "Valor financeiro mensal previsto para o gasto fixo (deve ser maior que zero)."
                  constraints:
                    nullable: false
              - column:
                  name: ATIVO
                  type: BOOLEAN
                  defaultValueBoolean: true
                  remarks: "Indicador lógico de ativação do gasto fixo (soft delete). True para ativo, false para desativado."
                  constraints:
                    nullable: false
              - column:
                  name: CREATED_AT
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  remarks: "Data e hora de criação do registro no sistema."
                  constraints:
                    nullable: false
              - column:
                  name: UPDATED_AT
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  remarks: "Data e hora da última atualização do registro no sistema."
                  constraints:
                    nullable: false
        - sql:
            sql: >
              ALTER TABLE GASTOS_FIXOS
                ADD CONSTRAINT CK_GASTO_FIXO_VALOR CHECK (VALOR > 0),
                ADD CONSTRAINT CK_GASTO_FIXO_DESCRICAO CHECK (LENGTH(TRIM(DESCRICAO)) > 0);
        - createIndex:
            indexName: IDX_GASTOS_FIXOS_USUARIO
            tableName: GASTOS_FIXOS
            columns:
              - column:
                  name: USUARIO_ID
