databaseChangeLog:
  - changeSet:
      id: 005-create-table-perfis-financeiros
      author: italo
      changes:
        - createTable:
            tableName: PERFIS_FINANCEIROS
            columns:
              - column:
                  name: ID
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: USUARIO_ID
                  type: BIGINT
                  constraints:
                    nullable: false
                    foreignKeyName: FK_PERFIL_FINANCEIRO_USUARIO
                    references: USERS(ID)
                    deleteCascade: true
                    unique: true
              - column:
                  name: RENDA_MENSAL
                  type: NUMERIC(15,2)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: RENDA_EXTRA
                  type: NUMERIC(15,2)
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
              - column:
                  name: PERCENTUAL_ALERTA_PADRAO
                  type: NUMERIC(5,2)
                  defaultValueNumeric: 80
                  constraints:
                    nullable: false
              - column:
                  name: ONBOARDING_CONCLUIDO
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: CREATED_AT
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: UPDATED_AT
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - sql:
            sql: >
              ALTER TABLE PERFIS_FINANCEIROS
                ADD CONSTRAINT CK_PERFIL_RENDA_MENSAL CHECK (RENDA_MENSAL >= 0),
                ADD CONSTRAINT CK_PERFIL_RENDA_EXTRA CHECK (RENDA_EXTRA >= 0),
                ADD CONSTRAINT CK_PERFIL_PERCENTUAL_ALERTA CHECK (PERCENTUAL_ALERTA_PADRAO > 0 AND PERCENTUAL_ALERTA_PADRAO <= 100);
